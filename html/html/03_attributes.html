<!doctype html>
<html>
  <head>
    <title>태그 속성 연습</title>
  </head>
  <body>
    <div tabindex="5" title="A 항목을 선택했습니다.">A</div>
    <div tabindex="3" title="B 항목을 선택했습니다.">B</div>
    <div tabindex="4" title="C 항목을 선택했습니다.">C</div>
    <div tabindex="1" title="D 항목을 선택했습니다.">D</div>
    <div tabindex="2" title="E 항목을 선택했습니다.">E</div>

    <table style="width: 100%">
      <!-- 각 칸(컬럼)의 크기를 결정-->
      <colgroup>
        <col width="20%" />
        <!-- 전체 크기의 20% -->
        <col width="*" />
        <!-- 나머지 -->
        <col width="40%" />
        <!-- 전체 크기의 40% -->
      </colgroup>
      <!-- 표의 제목 부분을 표현-->
      <thead>
        <!-- Tabel Row -->
        <tr>
          <th>제목 1</th>
          <th>제목 2</th>
          <th>제목 3</th>
        </tr>
      </thead>

      <!-- 표의 내용 부분을 표현-->
      <tbody>
        <!-- Table Row -->
        <tr>
          <!-- Table Dataset -->
          <td>제목입니다.</td>
          <td>두 번째 제목입니다.</td>
          <td>세 번째 제목입니다.</td>
        </tr>
        <tr>
          <!-- Table Dataset -->
          <td>제목입니다.</td>
          <td>두 번째 제목입니다.</td>
          <td>세 번째 제목입니다.</td>
        </tr>
        <tr>
          <td rowspan="3">제목입니다.9</td>
        </tr>
        <tr>
          <td>제목입니다.8</td>
          <td>제목입니다.7</td>
        </tr>
        <tr>
          <td colspan="2">제목입니다.6</td>
        </tr>
      </tbody>

      <!-- 표의 가장 하단 부분을 표현 (잘 사용되지 않음)-->
      <tfoot>
        <tr>
          <!-- Table Dataset -->
          <td>A</td>
          <td>B</td>
          <td>C</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
