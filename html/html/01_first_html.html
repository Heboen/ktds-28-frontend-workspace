<!--
 <!DOCTYPE html>
 "html 문서를 html5버전으로 작성하겠다" 라는 선언자

 문서 타입이 없다면 브라우저는 html4.01 버전으로 인식
-->
<!doctype html>
<!--
 <html>
 html 파일의 전체 구조를 정의.
 메타데이터와 본문 내용을 저장하기 위한 최 상단 태그
 -->
<html>
  <!-- head
 html 파일의 메타데이터(페이지의 이름, 스타일, 자바 스크립트, 검색엔진 최적화, 문서의 언어 종류 등)을 정의하는 곳
 -->
  <head>
    <!-- 문서의 이름 - 브라우저 탭에 표시 -->
    <title>첫 번째 HTML 문서 입니다.</title>
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="https://www.naver.com/favicon.ico?1"
    />
  </head>
  <!-- <body> 브라우저의 본문 내용에 표시할 컨텐츠 작성-->
  <body>
    반갑습니다. 첫 번째 HTML 파일 입니다. 띄어 쓰기를 여러 번 해봅니다.
  </body>
</html>
