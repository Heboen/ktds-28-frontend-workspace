<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link type="text/css" rel="stylesheet" href="../css/31_flex.css">
</head>
<body>
    <h1>Flex Row</h1>
    <div class="flex-row">
        <div>A</div>
        <div>B</div>
        <div>C</div>
    </div>
    <h1>Flex Row Reverse</h1>
    <ul class="flex-row-reverse">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>
    <h1>Flex Column</h1>
    <div class="flex-column">
        <div>A</div>
        <div>B</div>
        <div>C</div>
    </div>
    <h1>Flex Column Reverse</h1>
    <ul class="flex-column-reverse">
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>

    <h1>Flex Item Basis - Row</h1>
    <div class="flex-row">
        <div>A1231213131321313</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>E</div>
        <div>F</div>
        <div>G</div>
    </div>

    <h1>Flex Item Basis - Column</h1>
    <div class="flex-column">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>E</div>
        <div>F</div>
        <div>G</div>
    </div>
</body>
</html>
